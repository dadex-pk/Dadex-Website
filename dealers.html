<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Find a Dealer | Dadex Eternit Limited</title>
<link href="css/root.css" rel="stylesheet"/>
<link href="css/base.css" rel="stylesheet"/>
<link href="css/layout.css" rel="stylesheet"/>
<link href="css/components.css" rel="stylesheet"/>
<link href="css/shell.css" rel="stylesheet"/>
<link href="css/pages.css" rel="stylesheet"/>
</head>
<body>
<div data-component="header"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="kicker">Dealer Network</div>
      <h1>Find a <span>Dealer</span></h1>
      <p>Find an approved Dadex dealer or distributor by location, product or dealer name.</p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      
      <div class="dealer-filters">
        <div>
          <label style="font-size: 0.75rem; font-weight: 800; display: block; margin-bottom: 0.5rem;">Province</label>
          <select id="provinceFilter"><option value="">All Provinces</option></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; font-weight: 800; display: block; margin-bottom: 0.5rem;">City</label>
          <select id="cityFilter"><option value="">All Cities</option></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; font-weight: 800; display: block; margin-bottom: 0.5rem;">Product</label>
          <select id="productFilter"><option value="">All Products</option></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; font-weight: 800; display: block; margin-bottom: 0.5rem;">Search</label>
          <input type="search" id="nameSearch" placeholder="Dealer name...">
        </div>
        <div style="display: flex; align-items: flex-end;">
          <button class="btn btn--outline" id="resetFilters" style="width: 100%;">Clear</button>
        </div>
      </div>

      <div class="flex-between" style="margin-bottom: 2rem;">
        <p id="resultsSummary" style="margin: 0; color: var(--muted);">Showing all listings.</p>
      </div>

      <div class="grid grid-3" id="dealerGrid"></div>
    </div>
  </section>

  <template id="dealerCardTemplate">
    <article class="card">
      <div class="flex-between" style="margin-bottom: 1rem;">
        <span class="dealer-type" data-field="type" style="font-size: 0.75rem; background: var(--bg-mist); padding: 0.25rem 0.5rem; border-radius: var(--radius-pill); font-weight: 700;"></span>
        <i class="fas fa-store" style="color: var(--line);"></i>
      </div>
      <h3 data-field="name" style="margin-bottom: 0.25rem;"></h3>
      <p class="dealer-contact-name" data-field="contact-name" style="font-size: 0.875rem; margin-bottom: 1rem;"></p>
      
      <div style="font-size: 0.875rem; color: var(--muted); margin-bottom: 1rem;">
        <p data-field="location" style="margin-bottom: 0.25rem;"><i class="fas fa-map-marker-alt" style="color: var(--brand-red); width: 1.25rem;"></i><span></span></p>
        <p data-field="address" style="margin-bottom: 0.25rem;"></p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
        <a data-field="phone" href="#"><i class="fas fa-phone" style="color: var(--brand-red); width: 1.25rem;"></i> <span></span></a>
        <a data-field="email" href="#"><i class="fas fa-envelope" style="color: var(--brand-red); width: 1.25rem;"></i> <span></span></a>
      </div>
    </article>
  </template>
</main>
<div data-component="footer"></div>
<script src="dealers-data.js"></script>
<script src="js/dealers.js"></script>
<script src="js/main.js"></script>
</body>
</html>
