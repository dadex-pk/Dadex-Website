<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Search Dadex | Dadex Eternit Limited</title>
<link href="css/root.css" rel="stylesheet"/>
<link href="css/base.css" rel="stylesheet"/>
<link href="css/layout.css" rel="stylesheet"/>
<link href="css/components.css" rel="stylesheet"/>
<link href="css/shell.css" rel="stylesheet"/>
<link href="css/core.css" rel="stylesheet"/>
</head>
<body>
<div data-component="header"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="kicker">Search</div>
      <h1>Search <span>Dadex</span></h1>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div style="max-width: 800px; margin: 0 auto;">
        <div class="search-bar" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
          <input type="search" id="siteSearchInput" placeholder="Search products, projects, resources..." style="flex: 1; padding: 1rem; border: 1px solid var(--line); border-radius: var(--radius-sm);">
          <button class="btn btn--primary" id="siteSearchButton">Search</button>
        </div>
        
        <div class="flex-between" style="margin-bottom: 2rem;">
          <strong id="searchCount" style="color: var(--muted);">Start searching</strong>
          <button class="btn btn--outline" id="searchClear">Clear</button>
        </div>

        <div class="grid grid-2" id="searchResults"></div>

        <div id="searchEmpty" hidden style="text-align: center; padding: 4rem 0;">
          <i class="fas fa-magnifying-glass" style="font-size: 3rem; color: var(--line); margin-bottom: 1rem;"></i>
          <h3>No matching pages</h3>
          <p>Try a broader keyword or browse the main sections of the Dadex website.</p>
        </div>
      </div>
    </div>
  </section>

  <template id="searchResultTemplate">
    <article class="card">
      <span class="result-type" style="font-size: 0.75rem; font-weight: 800; color: var(--brand-red); text-transform: uppercase;"></span>
      <h3 style="margin: 0.5rem 0;"></h3>
      <p style="font-size: 0.875rem; margin-bottom: 1rem;"></p>
      <a href="#" class="btn btn--outline" style="width: max-content; margin-top: auto;">Open page</a>
    </article>
  </template>
</main>
<div data-component="footer"></div>
<script src="search-index.js"></script>
<script src="js/main.js"></script>
</body>
</html>
