<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Dadex | Dadex Eternit Limited</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/contact-dealers-search.css">
</head>
<body>
<div data-component="header"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="kicker">Search</div>
      <h1>Search <span>Dadex</span></h1>
      <p>Search across our complete catalog of products, technical resources, and corporate information.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div style="max-width: 800px; margin: 0 auto;">
        
        <!-- Premium Search Bar -->
        <div class="search-input-wrapper">
          <i class="fas fa-magnifying-glass search-icon"></i>
          <input type="search" id="siteSearchInput" placeholder="Search products, projects, resources..." autocomplete="off">
          <button type="button" id="searchClear" class="search-clear-btn" aria-label="Clear search">
            <i class="fas fa-xmark"></i>
          </button>
        </div>

        <!-- Popular Searches (Visible before typing) -->
        <div class="popular-searches" id="popularSearches">
          <span>Popular:</span>
          <button class="filter-btn" data-query="Aquadex">Aquadex</button>
          <button class="filter-btn" data-query="T-Flex">T-Flex</button>
          <button class="filter-btn" data-query="Manholes">Manholes</button>
          <button class="filter-btn" data-query="Annual Reports">Annual Reports</button>
        </div>

        <div class="flex-between" style="margin-bottom: 2rem;">
          <strong id="searchCount" style="color: var(--muted);">Start searching</strong>
        </div>

        <div class="grid grid-2" id="searchResults"></div>

        <!-- Empty State -->
        <div id="searchEmpty" hidden style="text-align: center; padding: 4rem 0;">
          <i class="fas fa-folder-open" style="font-size: 3rem; color: var(--line); margin-bottom: 1rem;"></i>
          <h3>No matching pages</h3>
          <p>Try a broader keyword or browse the main sections.</p>
          <p style="margin-top: 1rem;"><strong>Need help?</strong> Call our UAN: <a href="tel:111000789" style="color: var(--brand-red); font-weight: bold;">111-000-789</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Enhanced Result Template -->
  <template id="searchResultTemplate">
    <article class="card search-result-card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
        <span class="result-badge"></span>
        <i class="fas fa-arrow-up-right-from-square" style="color: var(--line); font-size: 0.875rem;"></i>
      </div>
      <h3 style="margin: 0 0 0.5rem;"></h3>
      <p style="font-size: 0.875rem; color: var(--muted); margin-bottom: 1.5rem; flex: 1;"></p>
      <a href="#" class="btn btn--outline" style="width: max-content; margin-top: auto;">Open page <i class="fas fa-arrow-right"></i></a>
    </article>
  </template>
</main>
<div data-component="footer"></div>
<script src="search-index.js"></script>
<script src="js/main.js"></script>
</body>
</html>
