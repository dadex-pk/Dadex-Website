<dialog id="dexpertDialog" class="dexpert-dialog" aria-labelledby="expert-title">
  <div class="dexpert-head">
    <div class="expert-icon">
      <img src="assets/images/Dexpert.png" alt="" aria-hidden="true">
    </div>
    <div class="dexpert-brand">
      <strong id="expert-title">DEXPERT</strong>
      <span>Your building solutions guide</span>
    </div>
    <button class="dexpert-close" aria-label="Close assistant">×</button>
  </div>
  <div class="dexpert-body">
    <!-- Live region for accessibility updates -->
    <div id="dexpertBody" aria-live="polite"></div>
    
    <form class="dexpert-ask">
      <label for="expert-input">OR TELL US WHAT YOU’RE BUILDING</label>
      <div>
        <input id="expert-input" placeholder="e.g. Plumbing for a new home" required>
        <button aria-label="Send question" type="submit">
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <small>Product guidance to help you take the next step.</small>
    </form>
  </div>
</dialog>

<!-- Home Template with Quick Action Chips -->
<template id="dexpertHomeTemplate">
  <div class="dexpert-home">
    <span class="dexpert-welcome">A STRONGER START TO YOUR PROJECT</span>
    <h4>What are you building?</h4>
    <p class="dexpert-intro">Let’s point you towards the right Dadex solution. Choose a starting point or tap a quick filter below.</p>
    
    <!-- Quick-tap suggestion chips -->
    <div class="dexpert-chips" aria-label="Quick suggestions">
      <button type="button" class="dexpert-chip" data-query="Water Supply">Water Supply</button>
      <button type="button" class="dexpert-chip" data-query="Drainage">Drainage</button>
      <button type="button" class="dexpert-chip" data-query="Gas">Gas Piping</button>
      <button type="button" class="dexpert-chip" data-query="Literature">Literature</button>
    </div>

    <div class="dexpert-actions"></div>
  </div>
</template>

<!-- Result Template -->
<template id="dexpertResultTemplate">
  <div class="dexpert-result">
    <button class="dexpert-back" type="button">← Back to all options</button>
    <span data-label></span>
    <h4 data-heading></h4>
    <p data-message></p>
    <a href="#" class="dexpert-result-link">
      <span data-cta></span>
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</template>
