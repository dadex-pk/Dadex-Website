<!-- components/dexpert.html -->
<dialog
  id="dexpertDialog"
  class="dexpert-dialog"
  aria-labelledby="expert-title"
  aria-describedby="expert-subtitle">

  <div class="dexpert-head">
    <div class="dexpert-icon">
      <img src="assets/images/Dexpert.png" alt="" aria-hidden="true">
    </div>
    <div class="dexpert-brand">
      <strong id="expert-title">DEXPERT</strong>
      <span id="expert-subtitle">Your building solutions guide</span>
    </div>
    <button class="dexpert-close" aria-label="Close assistant" type="button">
      <i class="fas fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <div class="dexpert-body">
    <div id="dexpertBody"></div>

    <form class="dexpert-ask" autocomplete="off">
      <label for="expert-input">OR TELL US WHAT YOU’RE BUILDING</label>
      <div class="dexpert-ask-row">
        <input
          id="expert-input"
          type="text"
          placeholder="e.g. Plumbing for a new home"
          required>
        <button type="submit" aria-label="Ask DEXPERT">
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <small>Product guidance to help you take the next step.</small>
    </form>
  </div>
</dialog>

<template id="dexpertHomeTemplate">
  <div class="dexpert-home">
    <span class="dexpert-welcome">A STRONGER START TO YOUR PROJECT</span>
    <h4>What are you building?</h4>
    <p class="dexpert-intro">Let’s point you towards the right Dadex solution. Choose a starting point below.</p>
    <div class="dexpert-actions"></div>
  </div>
</template>

<template id="dexpertResultTemplate">
  <div class="dexpert-result">
    <button class="dexpert-back" type="button">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      Back to all options
    </button>
    <span class="dexpert-result-label" data-label></span>
    <h4 data-heading></h4>
    <p data-message></p>
    <a href="#" class="dexpert-result-link">
      <span data-cta></span>
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</template>
