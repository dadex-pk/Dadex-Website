<template id="dexpertHomeTemplate">
  <div class="dexpert-kicker">A STRONGER START TO YOUR PROJECT</div>
  <h4>What are you building?</h4>
  <p class="dexpert-intro"></p>
  <div class="dexpert-actions"></div>
</template>

<template id="dexpertResultTemplate">
  <button class="dexpert-back">← Back to all options</button>
  <div class="dexpert-result">
    <span data-label></span>
    <h4 data-heading></h4>
    <p data-message></p>
    <a class="dexpert-result-link" href="#">
      <span data-cta></span>
      <svg style="width:16px;height:16px;"><use href="#arrow"/></svg>
    </a>
  </div>
</template>

<dialog class="dexpert-dialog" id="dexpertDialog" aria-labelledby="expert-title">
  <div class="dexpert-head">
    <div class="dexpert-icon-wrapper">
      <svg><use href="assets/images/dexpert.png"/></svg>
    </div>
    <div class="dexpert-brand">
      <strong id="expert-title">DEXPERT</strong>
      <br>
      <span>Your building solutions guide</span>
    </div>
    <button class="dexpert-close" aria-label="Close assistant">×</button>
  </div>
  
  <div class="dexpert-body" id="dexpertBody">
    <!-- Dynamic content injects here -->
  </div>

  <form class="dexpert-ask">
    <label for="expert-input">OR TELL US WHAT YOU’RE BUILDING</label>
    <div>
      <input id="expert-input" placeholder="e.g. Plumbing for a new home" required>
      <button aria-label="Send question"><svg><use href="#arrow"/></svg></button>
    </div>
    <small>Product guidance to help you take the next step.</small>
  </form>
</dialog>
